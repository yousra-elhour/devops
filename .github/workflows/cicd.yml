name: CI/CD for Flask App

on:
  push:
    branches: ["main", "master", "feature/flask-app"]
  pull_request:
    branches: ["main", "master", "feature/flask-app"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: List files
        run: echo "Hello from CI"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Debug environment variables
        run: |
          echo "GitHub SHA: ${{ github.sha }}"
          echo "Docker Username (masked): ${{ secrets.DOCKER_USERNAME }}"
          echo "Checking if DOCKER_USERNAME is set..."
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "ERROR: DOCKER_USERNAME secret is not set!"
            exit 1
          fi

      - name: Build and push Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          docker build -t flask-app:latest .
          echo "Tagging image as: ${DOCKER_USERNAME}/flask-app:${COMMIT_SHA}"
          docker tag flask-app:latest ${DOCKER_USERNAME}/flask-app:${COMMIT_SHA}
          echo "Pushing to Docker Hub..."
          docker push ${DOCKER_USERNAME}/flask-app:${COMMIT_SHA}

      - name: Verify Docker image was pushed
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Verifying Docker image was pushed successfully..."
          echo "Docker image: ${DOCKER_USERNAME}/flask-app:${COMMIT_SHA}"
          docker pull ${DOCKER_USERNAME}/flask-app:${COMMIT_SHA}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: "yousra"
          publish-profile: ${{ secrets.AZURE }}
          images: ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }}
