name: CI/CD for Flask App

on:
  push:
    branches: ["main", "master", "feature/flask-app"]
  pull_request:
    branches: ["main", "master", "feature/flask-app"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: List files
        run: echo "Hello from CI"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install flake8

      - name: Run tests (if any)
        run: |
          # Add your test commands here
          echo "Running tests..."
          # python -m pytest tests/ || echo "No tests found"

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' # Only build on push, not PRs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image (local)
        run: |
          docker build -t flask-app:latest .
          echo "Docker image built successfully"

      - name: Log in to Docker Hub
        if: secrets.DOCKER_USERNAME != ''
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image to Docker Hub
        if: secrets.DOCKER_USERNAME != ''
        run: |
          docker tag flask-app:latest ${{ secrets.DOCKER_USERNAME }}/flask-app:latest
          docker tag flask-app:latest ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' # Only deploy from main/master
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying Flask app to production..."
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "Docker image: ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }}"
          else
            echo "DOCKER_USERNAME secret not set - skipping Docker Hub deployment"
          fi

      - name: Deploy to Azure Web App
        if: secrets.AZURE != '' && secrets.DOCKER_USERNAME != ''
        uses: azure/webapps-deploy@v2
        with:
          app-name: "yousra"
          publish-profile: ${{ secrets.AZURE }}
          images: ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }}
